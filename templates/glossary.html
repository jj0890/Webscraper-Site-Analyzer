<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Dictionary — Web Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface-0: #0f0f11;
            --surface-1: #161618;
            --surface-2: #1c1c20;
            --surface-3: #242429;
            --surface-4: #2c2c33;
            --border-subtle: rgba(255,255,255,0.06);
            --border-default: rgba(255,255,255,0.10);
            --border-strong: rgba(255,255,255,0.16);
            --border-accent: rgba(99,102,241,0.4);
            --text-primary: #f0f0f3;
            --text-secondary: #a0a0ab;
            --text-tertiary: #636370;
            --text-disabled: #454550;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-muted: rgba(129,140,248,0.12);
            --accent-strong: rgba(129,140,248,0.24);
            --accent-text: #a5b4fc;
            --success: #34d399;
            --success-muted: rgba(52,211,153,0.12);
            --warning: #fbbf24;
            --warning-muted: rgba(251,191,36,0.12);
            --danger: #f87171;
            --danger-muted: rgba(248,113,113,0.12);
            --info: #38bdf8;
            --info-muted: rgba(56,189,248,0.12);
            --pink: #f472b6;
            --pink-muted: rgba(244,114,182,0.12);
            --orange: #fb923c;
            --orange-muted: rgba(251,146,60,0.12);
            --cyan: #22d3ee;
            --cyan-muted: rgba(34,211,238,0.12);
            --font-display: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-base: 0.875rem;
            --text-md: 0.9375rem; --text-lg: 1.0625rem; --text-xl: 1.25rem;
            --text-2xl: 1.5rem; --text-3xl: 1.875rem;
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
            --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
            --space-8: 2rem; --space-10: 2.5rem;
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 100px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── Nav ── */
        .wi-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: var(--space-4) var(--space-8);
            background: var(--surface-1); border-bottom: 1px solid var(--border-subtle);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
        }
        .wi-logo { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .wi-logo span { color: var(--accent); }
        .wi-nav-links { list-style: none; display: flex; gap: var(--space-6); }
        .wi-nav-link { color: var(--text-secondary); text-decoration: none; font-size: var(--text-sm); font-weight: 500; transition: color 0.15s; }
        .wi-nav-link:hover, .wi-nav-link.active { color: var(--text-primary); }

        /* ── Layout: sidebar + grid ── */
        .page-layout {
            display: flex; max-width: 1400px; margin: 0 auto;
            padding: var(--space-8) var(--space-8) var(--space-8) 0;
            gap: var(--space-8);
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 220px; flex-shrink: 0; position: sticky; top: 80px;
            max-height: calc(100vh - 100px); overflow-y: auto;
            padding: 0 var(--space-4); scrollbar-width: thin;
        }
        .sidebar-label {
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-tertiary);
            padding: 0 var(--space-3) var(--space-3);
        }
        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
            cursor: pointer; font-size: var(--text-sm); color: var(--text-secondary);
            transition: all 0.15s; margin-bottom: 2px; user-select: none;
        }
        .sidebar-item:hover { background: var(--surface-3); color: var(--text-primary); }
        .sidebar-item.active { background: var(--accent-muted); color: var(--accent-text); }
        .sidebar-icon { margin-right: var(--space-2); font-size: 1em; }
        .sidebar-count {
            font-size: var(--text-xs); font-family: var(--font-mono);
            color: var(--text-disabled); background: var(--surface-3);
            padding: 1px 6px; border-radius: var(--radius-full);
        }
        .sidebar-item.active .sidebar-count { background: var(--accent-strong); color: var(--accent-text); }

        /* ── Main content ── */
        .main-content { flex: 1; min-width: 0; }

        .page-header { margin-bottom: var(--space-8); }
        .page-eyebrow {
            font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--accent); font-weight: 600; margin-bottom: var(--space-2);
        }
        .page-title { font-size: var(--text-3xl); font-weight: 700; margin-bottom: var(--space-2); }
        .page-subtitle { color: var(--text-tertiary); font-size: var(--text-base); }

        /* ── Search ── */
        .search-box {
            width: 100%; padding: var(--space-3) var(--space-5);
            background: var(--surface-2); border: 1px solid var(--border-default);
            border-radius: var(--radius-md); color: var(--text-primary);
            font-family: var(--font-body); font-size: var(--text-base);
            margin-bottom: var(--space-6); transition: border-color 0.15s;
        }
        .search-box:focus { outline: none; border-color: var(--accent); }
        .search-box:focus-visible,
        input[type="search"]:focus-visible,
        input[type="text"]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .search-box::placeholder { color: var(--text-disabled); }
        .search-meta {
            font-size: var(--text-xs); color: var(--text-disabled);
            margin-top: calc(-1 * var(--space-4)); margin-bottom: var(--space-6);
            font-family: var(--font-mono);
        }

        /* ── Card grid ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-4);
        }

        /* ── Card ── */
        .dict-card {
            background: var(--surface-2); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .dict-card:hover {
            border-color: var(--border-default);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        /* ── Preview area ── */
        .card-preview {
            height: 180px; background: var(--surface-3);
            display: flex; align-items: center; justify-content: center;
            padding: var(--space-4); overflow: hidden;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
        }

        /* ── Card body ── */
        .card-body { padding: var(--space-4) var(--space-5) var(--space-5); }
        .card-term {
            font-size: var(--text-lg); font-weight: 600; color: var(--text-primary);
            margin-bottom: var(--space-1);
        }
        .card-def {
            font-size: var(--text-sm); color: var(--text-secondary);
            line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-tags { margin-top: var(--space-3); display: flex; gap: var(--space-2); flex-wrap: wrap; }
        .card-tag {
            font-size: var(--text-xs); padding: 2px 8px; border-radius: var(--radius-full);
            font-weight: 600;
        }
        .tag-layout { background: var(--accent-muted); color: var(--accent-text); }
        .tag-typography { background: var(--pink-muted); color: var(--pink); }
        .tag-color { background: var(--orange-muted); color: var(--orange); }
        .tag-spacing { background: var(--cyan-muted); color: var(--cyan); }
        .tag-hierarchy { background: var(--warning-muted); color: var(--warning); }
        .tag-interaction { background: var(--success-muted); color: var(--success); }
        .tag-accessibility { background: var(--success-muted); color: var(--success); }
        .tag-architecture { background: var(--info-muted); color: var(--info); }
        .tag-pattern { background: var(--danger-muted); color: var(--danger); }
        .tag-motion { background: var(--pink-muted); color: var(--pink); }

        /* ════════════════════════════════════════
           MINI-UI PREVIEW COMPONENTS
           Tiny CSS-only diagrams inside card-preview
           ════════════════════════════════════════ */

        /* Generic mini building blocks */
        .mini { font-size: 10px; color: var(--text-tertiary); }
        .mini-box {
            border-radius: 4px; background: var(--accent-muted);
            border: 1px solid rgba(129,140,248,0.2);
        }
        .mini-box-solid {
            border-radius: 4px; background: var(--accent);
        }
        .mini-label {
            font-size: 8px; font-family: var(--font-mono); color: var(--text-disabled);
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        /* ── Grid Layout preview ── */
        .preview-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 6px; width: 160px;
        }
        .preview-grid .cell {
            height: 40px; border-radius: 4px;
            background: var(--accent-muted); border: 1px solid rgba(129,140,248,0.25);
        }
        .preview-grid .cell:nth-child(odd) { background: var(--accent-strong); }

        /* ── Masonry preview ── */
        .preview-masonry {
            display: flex; gap: 5px; width: 150px;
        }
        .preview-masonry .col { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .preview-masonry .brick {
            border-radius: 3px; background: var(--accent-muted);
            border: 1px solid rgba(129,140,248,0.2);
        }

        /* ── Flexbox preview ── */
        .preview-flex {
            display: flex; gap: 6px; align-items: center;
        }
        .preview-flex .item {
            padding: 6px 14px; border-radius: 4px; font-size: 9px;
            font-family: var(--font-mono); color: var(--accent-text);
            background: var(--accent-muted); border: 1px solid rgba(129,140,248,0.25);
            white-space: nowrap;
        }

        /* ── Type scale preview ── */
        .preview-type-scale {
            display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        }
        .preview-type-scale .size {
            color: var(--text-primary); font-weight: 600; line-height: 1.1;
            white-space: nowrap;
        }
        .preview-type-scale .label {
            font-size: 8px; font-family: var(--font-mono);
            color: var(--text-disabled); margin-left: 6px;
        }

        /* ── Color palette preview ── */
        .preview-palette {
            display: flex; gap: 6px; align-items: flex-end;
        }
        .preview-palette .swatch {
            width: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.15s;
        }
        .preview-palette .swatch:hover { transform: scale(1.1); }

        /* ── Spacing scale preview ── */
        .preview-spacing {
            display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
        }
        .preview-spacing .bar {
            height: 12px; border-radius: 3px; background: var(--accent);
            opacity: 0.7; position: relative;
        }
        .preview-spacing .bar-label {
            position: absolute; right: -28px; top: 1px;
            font-size: 7px; font-family: var(--font-mono); color: var(--text-disabled);
        }

        /* ── Shadow elevation preview ── */
        .preview-shadows {
            display: flex; gap: 16px; align-items: center;
        }
        .preview-shadows .shadow-card {
            width: 48px; height: 48px; border-radius: 8px;
            background: var(--surface-2); display: flex; align-items: center;
            justify-content: center; font-size: 8px; font-family: var(--font-mono);
            color: var(--text-tertiary);
        }

        /* ── Z-index stack preview ── */
        .preview-zstack {
            position: relative; width: 140px; height: 120px;
        }
        .preview-zstack .layer {
            position: absolute; border-radius: 6px; border: 1px solid;
            display: flex; align-items: flex-end; justify-content: flex-start;
            padding: 4px 6px; font-size: 7px; font-family: var(--font-mono);
        }

        /* ── Hero section preview ── */
        .preview-hero {
            width: 180px; background: var(--surface-1); border-radius: 6px;
            overflow: hidden; border: 1px solid var(--border-subtle);
        }
        .preview-hero-bar {
            height: 10px; background: var(--surface-4); display: flex;
            align-items: center; padding: 0 6px; gap: 8px;
        }
        .preview-hero-bar .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-disabled); }
        .preview-hero-body {
            padding: 12px 10px; text-align: center;
        }
        .preview-hero-h { width: 80%; height: 6px; background: var(--text-primary); border-radius: 2px; margin: 0 auto 6px; }
        .preview-hero-p { width: 60%; height: 3px; background: var(--text-disabled); border-radius: 2px; margin: 0 auto 8px; }
        .preview-hero-btn {
            display: inline-block; padding: 3px 12px; background: var(--accent);
            border-radius: 3px; font-size: 7px; color: white; font-weight: 600;
        }

        /* ── Breakpoint preview ── */
        .preview-breakpoints {
            display: flex; gap: 8px; align-items: flex-end;
        }
        .preview-bp-device {
            border: 1px solid var(--border-default); border-radius: 4px;
            background: var(--surface-1); display: flex; flex-direction: column;
            align-items: center; padding-bottom: 3px;
        }
        .preview-bp-screen { background: var(--accent-muted); width: 100%; border-radius: 3px 3px 0 0; }
        .preview-bp-label { font-size: 6px; font-family: var(--font-mono); color: var(--text-disabled); margin-top: 2px; }

        /* ── Whitespace preview ── */
        .preview-whitespace {
            display: flex; gap: 12px; align-items: center;
        }
        .preview-ws-box {
            border: 1px dashed var(--border-default); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .preview-ws-inner {
            background: var(--accent-muted); border-radius: 4px;
            border: 1px solid rgba(129,140,248,0.25);
        }

        /* ── Hover state preview ── */
        .preview-states {
            display: flex; gap: 8px; align-items: center;
        }
        .preview-state-btn {
            padding: 6px 14px; border-radius: 6px; font-size: 9px;
            font-weight: 600; border: none; cursor: default;
            font-family: var(--font-body); transition: all 0.2s;
        }

        /* ── Accessibility tree preview ── */
        .preview-a11y {
            display: flex; flex-direction: column; gap: 2px; font-size: 9px;
            font-family: var(--font-mono); color: var(--text-tertiary);
        }
        .preview-a11y .landmark {
            padding: 2px 8px; border-radius: 3px; border-left: 2px solid;
        }

        /* ── Motion tokens preview ── */
        .preview-motion {
            display: flex; gap: 12px; align-items: center;
        }
        .preview-motion .dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--accent);
        }
        .preview-motion .dot-ease {
            animation: motionBounce 2s infinite;
        }
        .preview-motion .dot-linear {
            animation: motionBounce 2s infinite linear;
        }
        .preview-motion .dot-spring {
            animation: motionBounce 2s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes motionBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .preview-motion .label {
            font-size: 7px; font-family: var(--font-mono);
            color: var(--text-disabled); text-align: center; margin-top: 4px;
        }

        /* ── Contrast preview ── */
        .preview-contrast {
            display: flex; gap: 8px; align-items: center;
        }
        .preview-contrast-box {
            padding: 8px 12px; border-radius: 6px; font-size: 10px;
            font-weight: 600; text-align: center; width: 64px;
        }

        /* ── Navigation preview ── */
        .preview-nav {
            width: 180px; background: var(--surface-1); border-radius: 6px;
            overflow: hidden; border: 1px solid var(--border-subtle);
        }
        .preview-nav-bar {
            display: flex; gap: 0; background: var(--surface-4);
        }
        .preview-nav-item {
            padding: 6px 10px; font-size: 8px; color: var(--text-disabled);
            font-family: var(--font-mono); border-bottom: 2px solid transparent;
        }
        .preview-nav-item.active {
            color: var(--accent-text); border-bottom-color: var(--accent);
            background: rgba(129,140,248,0.06);
        }

        /* ── DOM depth preview ── */
        .preview-dom {
            display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
        }
        .preview-dom .node {
            display: flex; align-items: center; gap: 4px;
            font-size: 8px; font-family: var(--font-mono);
        }
        .preview-dom .tag { color: var(--danger); }
        .preview-dom .indent { display: inline-block; }

        /* ════════════════════════════════════════
           MODAL
           ════════════════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); z-index: 200;
            display: none; align-items: center; justify-content: center;
            padding: var(--space-8);
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface-2); border: 1px solid var(--border-default);
            border-radius: var(--radius-lg); max-width: 640px; width: 100%;
            max-height: 80vh; overflow-y: auto; padding: 0;
            box-shadow: var(--shadow-lg);
        }
        .modal-preview {
            height: 220px; background: var(--surface-3);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .modal-body { padding: var(--space-6) var(--space-8) var(--space-8); }
        .modal-term { font-size: var(--text-2xl); font-weight: 700; margin-bottom: var(--space-2); }
        .modal-def { color: var(--text-secondary); font-size: var(--text-base); line-height: 1.65; margin-bottom: var(--space-6); }
        .modal-section { margin-bottom: var(--space-5); }
        .modal-section-label {
            font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--text-tertiary); font-weight: 600; margin-bottom: var(--space-2);
        }
        .modal-section-text { color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.6; }
        .modal-close {
            position: absolute; top: var(--space-4); right: var(--space-4);
            background: var(--surface-4); border: 1px solid var(--border-default);
            color: var(--text-secondary); width: 32px; height: 32px;
            border-radius: var(--radius-full); cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .modal-close:hover { background: var(--surface-1); color: var(--text-primary); }

        /* Score table inside modal */
        .score-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: var(--surface-1); border-radius: var(--radius-md);
            overflow: hidden; border: 1px solid var(--border-subtle);
            font-size: var(--text-sm);
        }
        .score-table th {
            padding: var(--space-2) var(--space-4); text-align: left;
            font-size: var(--text-xs); color: var(--text-tertiary);
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
            background: var(--surface-1); border-bottom: 1px solid var(--border-subtle);
        }
        .score-table td {
            padding: var(--space-2) var(--space-4);
            border-top: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .score-table tbody tr:first-child td { border-top: none; }
        .score-range { color: var(--accent-text); font-weight: 600; font-family: var(--font-mono); }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .page-layout { padding: var(--space-6); }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        }
        @media (max-width: 500px) {
            .card-grid { grid-template-columns: 1fr; }
            .wi-nav { padding: var(--space-3) var(--space-4); }
        }

        /* ── Accessibility: Reduced Motion ── */
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
          }
        }
    </style>
</head>
<body>

    <nav class="wi-nav">
        <a class="wi-logo" href="/">Web<span>Intelligence</span></a>
        <ul class="wi-nav-links">
            <li><a href="/" class="wi-nav-link">Dashboard</a></li>
            <li><a href="/ripper" class="wi-nav-link">Ripper</a></li>
            <li><a href="/glossary" class="wi-nav-link active">Dictionary</a></li>
        </ul>
    </nav>

    <div class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-label">Categories</div>
            <div id="sidebarItems"></div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <div class="page-header">

// RENDERING
// ════════════════════════════════════════

const grid = document.getElementById('cardGrid');
const searchBox = document.getElementById('searchBox');
const searchMeta = document.getElementById('searchMeta');
const sidebarItems = document.getElementById('sidebarItems');
const modalOverlay = document.getElementById('modalOverlay');
const modalPreview = document.getElementById('modalPreview');
const modalBody = document.getElementById('modalBody');

// Build sidebar
let activeCategory = null;
CATEGORIES.forEach(cat => {
    const count = DB.filter(d => d.category === cat.id).length;
    const item = document.createElement('div');
    item.className = 'sidebar-item';
    item.dataset.cat = cat.id;
    item.innerHTML = `<span><span class="sidebar-icon">${cat.icon}</span>${cat.label}</span><span class="sidebar-count">${count}</span>`;
    item.addEventListener('click', () => {
        if (activeCategory === cat.id) {
            activeCategory = null;
            item.classList.remove('active');
        } else {
            activeCategory = cat.id;
            document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
            item.classList.add('active');
        }
        filterCards();
    });
    sidebarItems.appendChild(item);
});

// Build cards
const cardElements = [];
DB.forEach((entry, idx) => {
    const card = document.createElement('div');
    card.className = 'dict-card';
    card.dataset.idx = idx;
    card.dataset.category = entry.category;
    card.dataset.searchText = `${entry.term} ${entry.def} ${entry.tags.join(' ')} ${entry.category}`.toLowerCase();

    const tagClass = 'tag-' + entry.category;
    const catLabel = CATEGORIES.find(c => c.id === entry.category)?.label || entry.category;

    card.innerHTML = `
        <div class="card-preview">${entry.preview}</div>
        <div class="card-body">
            <div class="card-term">${entry.term}</div>
            <div class="card-def">${entry.def}</div>
            <div class="card-tags">
                <span class="card-tag ${tagClass}">${catLabel}</span>
                ${entry.tags.map(t => `<span class="card-tag" style="background:var(--surface-4);color:var(--text-tertiary)">${t}</span>`).join('')}
            </div>
            ${cardActionBadge(entry.action)}
        </div>
    `;

    card.addEventListener('click', () => openModal(idx));
    grid.appendChild(card);
    cardElements.push(card);
});

searchMeta.textContent = `${DB.length} patterns`;

// Lazy-render card previews with IntersectionObserver
const cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
            cardObserver.unobserve(entry.target);
        }
    });
}, { rootMargin: '100px' });

cardElements.forEach(card => {
    card.style.opacity = '0';
    card.style.transform = 'translateY(12px)';
    card.style.transition = 'opacity 0.3s, transform 0.3s';
    cardObserver.observe(card);
});

// ── Action buttons ──
const METRIC_LABELS = {
    typography: 'Typography', colors: 'Color Palette', spacing_scale: 'Spacing Scale',
    layout: 'Layout', spatial_composition: 'Spatial Composition',
    visual_hierarchy: 'Visual Hierarchy', motion_tokens: 'Motion Tokens',
    interaction_states: 'Interaction States', contrast_a11y: 'Color Contrast',
    accessibility_tree: 'Accessibility Tree', responsive_breakpoints: 'Responsive Breakpoints',
    shadow_system: 'Shadow System', z_index_stack: 'Z-Index Stack', dom_depth: 'DOM Depth',
    site_architecture: 'Site Architecture',
};

function buildActionButtons(actions) {
    if (!actions) return '';
    const list = Array.isArray(actions) ? actions : [actions];
    const btns = list.map(a => {
        if (a.type === 'ripper') {
            const href = `/ripper?search=${encodeURIComponent(a.query)}`;
            return `<a href="${href}" target="_blank"
                style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
                       background:rgba(129,140,248,0.12);border:1px solid rgba(129,140,248,0.25);
                       color:var(--accent-text);border-radius:8px;font-size:0.8rem;font-weight:600;
                       text-decoration:none;transition:background 0.15s;"
                onmouseover="this.style.background='rgba(129,140,248,0.22)'"
                onmouseout="this.style.background='rgba(129,140,248,0.12)'">
                🔍 Find on any site
            </a>`;
        }
        if (a.type === 'dashboard') {
            const label = METRIC_LABELS[a.metric] || a.metric;
            const href = `/?metric=${encodeURIComponent(a.metric)}`;
            return `<a href="${href}" target="_blank"
                style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
                       background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);
                       color:#34d399;border-radius:8px;font-size:0.8rem;font-weight:600;
                       text-decoration:none;transition:background 0.15s;"
                onmouseover="this.style.background='rgba(52,211,153,0.16)'"
                onmouseout="this.style.background='rgba(52,211,153,0.08)'">
                📊 Dashboard → ${label}
            </a>`;
        }
        if (a.type === 'states') {
            return `<div style="padding:8px 14px;background:rgba(251,146,60,0.08);
                       border:1px solid rgba(251,146,60,0.2);border-radius:8px;
                       font-size:0.78rem;color:#fb923c;line-height:1.4;">
                ⚡ ${a.note}
            </div>`;
        }
        return '';
    }).join('');

    return `<div style="margin-top:var(--space-5);padding-top:var(--space-4);
                 border-top:1px solid var(--border-subtle);
                 display:flex;flex-wrap:wrap;gap:var(--space-2);">
        ${btns}
    </div>`;
}

// Add action badge to card during build
function cardActionBadge(actions) {
    if (!actions) return '';
    const list = Array.isArray(actions) ? actions : [actions];
    const hasRipper = list.some(a => a.type === 'ripper');
    const hasDash = list.some(a => a.type === 'dashboard');
    const hasStates = list.some(a => a.type === 'states');
    const parts = [];
    if (hasRipper) parts.push(`<span title="Findable in Component Ripper" style="font-size:0.65rem;padding:2px 5px;background:rgba(129,140,248,0.12);color:var(--accent-text);border-radius:4px;">🔍 Rippable</span>`);
    if (hasDash)   parts.push(`<span title="Visible in Dashboard scan" style="font-size:0.65rem;padding:2px 5px;background:rgba(52,211,153,0.08);color:#34d399;border-radius:4px;">📊 Metric</span>`);
    if (hasStates) parts.push(`<span title="Capture via States mode" style="font-size:0.65rem;padding:2px 5px;background:rgba(251,146,60,0.08);color:#fb923c;border-radius:4px;">⚡ States</span>`);
    return parts.length ? `<div style="margin-top:var(--space-2);display:flex;gap:4px;flex-wrap:wrap;">${parts.join('')}</div>` : '';
}

// ── Search + filter ──
function filterCards() {
    const query = searchBox.value.toLowerCase().trim();
    let visible = 0;
    cardElements.forEach(card => {
        const matchesSearch = !query || card.dataset.searchText.includes(query);
        const matchesCat = !activeCategory || card.dataset.category === activeCategory;
        const show = matchesSearch && matchesCat;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    searchMeta.textContent = query || activeCategory
        ? `${visible} of ${DB.length} patterns`
        : `${DB.length} patterns`;
}

searchBox.addEventListener('input', filterCards);

// ── Modal ──
function openModal(idx) {
    const entry = DB[idx];
    const catLabel = CATEGORIES.find(c => c.id === entry.category)?.label || entry.category;
    const tagClass = 'tag-' + entry.category;

    modalPreview.innerHTML = entry.preview;
    modalBody.innerHTML = `
        <div class="card-tags" style="margin-bottom:var(--space-3)">
            <span class="card-tag ${tagClass}">${catLabel}</span>
            ${entry.tags.map(t => `<span class="card-tag" style="background:var(--surface-4);color:var(--text-tertiary)">${t}</span>`).join('')}
        </div>
        <div class="modal-term">${entry.term}</div>
        <div class="modal-def">${entry.def}</div>
        ${entry.whatWeCheck ? `
            <div class="modal-section">
                <div class="modal-section-label">What Our Scanner Checks</div>
                <div class="modal-section-text">${entry.whatWeCheck}</div>
            </div>
        ` : ''}
        ${entry.whyItMatters ? `
            <div class="modal-section">
                <div class="modal-section-label">Why It Matters</div>
                <div class="modal-section-text">${entry.whyItMatters}</div>
            </div>
        ` : ''}
        ${entry.whatGoodLooksLike ? `
            <div class="modal-section">
                <div class="modal-section-label">What Good Looks Like</div>
                <div class="modal-section-text">${entry.whatGoodLooksLike}</div>
            </div>
        ` : ''}
        ${entry.action ? buildActionButtons(entry.action) : ''}
    `;
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
}

modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});
</script>

</body>
</html>
